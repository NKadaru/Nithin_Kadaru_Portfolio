name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # The hero suite needs WebGL. Ubuntu runners have no GPU, so Playwright
      # is configured to use SwiftShader (software rendering) — see
      # playwright.config.ts launchOptions.
      - name: Run end-to-end tests
        run: npx playwright test e2e/hero.spec.ts e2e/sections.spec.ts

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

      # Hand the TESTED build to the deploy job. This is the whole point of the
      # pipeline's shape: the artifact that passed the tests above is the exact
      # artifact that goes live, with no second build anywhere.
      - name: Upload build for deployment
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: web/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # THE GATE: cannot start until `verify` succeeds, so a failing lint, type
    # error or test blocks the deploy entirely.
    needs: verify
    # Only deploy real pushes to main. Pull requests run `verify` only —
    # a PR from a fork must never be able to publish to production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    # Deliberately NOT `working-directory: web`.
    #
    # The Vercel project has Root Directory = "web", and the CLI applies that
    # setting relative to where it is invoked. Run from inside `web` it
    # resolves incorrectly — `vercel build` then executed `vite build` with no
    # node_modules/.bin on PATH and died with exit 127. Run from the repo root
    # it descends into `web` itself, which is the documented layout.

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The build produced and verified by `verify`, used below to replace
      # whatever `vercel build` produces, so the bytes that go live are the
      # bytes the tests ran against.
      - name: Download the tested build
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: tested-dist/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Fail fast with a readable message. Without this, a missing secret
      # reaches the CLI as an empty `--token=` and surfaces as
      # "You defined --token, but it's missing a value", which points at the
      # command rather than at the actual cause.
      - name: Check required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing or empty."
              missing=1
            else
              echo "$name is set (value hidden)"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Add them at:"
            echo "  Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "Names must match exactly, with underscores and no spaces."
            exit 1
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # `vercel build` is used rather than hand-assembling .vercel/output.
      # A hand-rolled output omitted `builds.json`, which `vercel build`
      # writes and which `vercel deploy --prebuilt` requires — the likely
      # reason the previous two deploys failed at upload.
      - name: Build output structure
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # Swap in the tested artifact. `vercel build` has produced a valid
      # output directory; its static payload is replaced with the exact files
      # that passed the test suite, so the deployed bytes are the verified
      # ones even though a build ran here to generate the wrapper.
      - name: Replace static output with the tested build
        run: |
          out=".vercel/output/static"
          if [ ! -d "$out" ]; then
            echo "::error::$out not found — vercel build did not produce static output."
            ls -R .vercel/output || true
            exit 1
          fi
          echo "Before swap:"; ls "$out" | head -20
          rm -rf "$out"
          mkdir -p "$out"
          cp -R tested-dist/. "$out/"
          echo "After swap:"; ls "$out" | head -20

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      # Checks the PRODUCTION ALIAS, not the URL `vercel deploy` prints.
      #
      # That command returns a deployment-specific URL
      # (project-<hash>-<scope>.vercel.app). Vercel's deployment protection
      # makes those URLs require authentication, so curling one returns 401
      # even when the deploy succeeded perfectly — which is exactly what
      # happened in run #14. The production alias is the public address and
      # the thing actually worth asserting.
      - name: Verify production responds
        env:
          PROD_URL: https://nithin-kadaru-portfolio.vercel.app
        run: |
          echo "Deployment URL (may be auth-protected): ${{ steps.deploy.outputs.url }}"
          echo "Checking production alias: $PROD_URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 4 "$PROD_URL")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Production did not return 200 (got $code)."
            exit 1
          fi
          # Confirm the document is the app shell rather than an error page.
          if curl -sS "$PROD_URL" | grep -q 'id="root"'; then
            echo "Production is serving the application shell."
          else
            echo "::error::Production responded 200 but the page is not the app shell."
            exit 1
          fi

      - name: Summarise
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "Production: <https://nithin-kadaru-portfolio.vercel.app>"
            echo ""
            echo "Deployment URL: ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Static payload is the artifact \`verify\` built and tested."
          } >> "$GITHUB_STEP_SUMMARY"
