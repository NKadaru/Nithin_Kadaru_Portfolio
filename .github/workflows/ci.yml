name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # The hero suite needs WebGL. Ubuntu runners have no GPU, so Playwright
      # is configured to use SwiftShader (software rendering) — see
      # playwright.config.ts launchOptions.
      - name: Run end-to-end tests
        run: npx playwright test e2e/hero.spec.ts e2e/sections.spec.ts

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

      # Hand the TESTED build to the deploy job. This is the whole point of the
      # pipeline's shape: the artifact that passed the tests above is the exact
      # artifact that goes live, with no second build anywhere.
      - name: Upload build for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: web/dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # THE GATE: cannot start until `verify` succeeds, so a failing lint, type
    # error or test blocks the deploy entirely.
    needs: verify
    # Only deploy real pushes to main. Pull requests run `verify` only —
    # a PR from a fork must never be able to publish to production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      # The build produced and verified by `verify`. Nothing is rebuilt here.
      - name: Download the tested build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: web/dist/

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Fail fast with a readable message. Without this, a missing secret
      # reaches the CLI as an empty `--token=` and surfaces as
      # "You defined --token, but it's missing a value", which points at the
      # command rather than at the actual cause.
      - name: Check required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing or empty."
              missing=1
            else
              echo "$name is set (value hidden)"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Add them at:"
            echo "  Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "Names must match exactly, with underscores and no spaces."
            exit 1
          fi

      - name: Pull Vercel project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Wraps the downloaded dist/ in Build Output API v3 format, translating
      # vercel.json's headers into output routes. `vercel build` is NOT used —
      # it would rebuild the app, defeating the one-build guarantee, and it
      # mis-resolves the project's Root Directory when run from inside `web`.
      - name: Package the tested build for Vercel
        run: node scripts/make-vercel-output.mjs

      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Verify the deployment responds
        run: |
          url="${{ steps.deploy.outputs.url }}"
          echo "Checking $url"
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 3 "$url")
          echo "HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Deployment did not return 200 (got $code)."
            exit 1
          fi

      - name: Summarise
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "<${{ steps.deploy.outputs.url }}>"
            echo ""
            echo "The artifact deployed is the one \`verify\` built and tested —"
            echo "no rebuild occurred at any point."
          } >> "$GITHUB_STEP_SUMMARY"
