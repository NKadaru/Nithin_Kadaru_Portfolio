name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install chromium --with-deps

      # The hero suite needs WebGL. Ubuntu runners have no GPU, so Playwright
      # is configured to use SwiftShader (software rendering) — see
      # playwright.config.ts launchOptions.
      - name: Run end-to-end tests
        run: npx playwright test e2e/hero.spec.ts e2e/sections.spec.ts

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: web/test-results/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # THE GATE: this job cannot start until `verify` succeeds, so a failing
    # lint, type error or test blocks the deploy entirely.
    needs: verify
    # Only deploy real pushes to main. Pull requests run `verify` only —
    # a PR from a fork must never be able to publish to production.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Each job runs on a fresh runner with its own filesystem, so the
      # dependencies installed in `verify` are not present here. Without this,
      # `vercel build` invokes `vite build` and fails with
      # "sh: 1: vite: not found" (exit 127).
      - name: Install dependencies
        run: npm ci

      # Fail fast with a readable message. Without this, a missing secret
      # reaches the CLI as an empty `--token=` and surfaces as
      # "You defined --token, but it's missing a value", which points at the
      # command rather than at the actual cause.
      - name: Check required secrets are present
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is missing or empty."
              missing=1
            else
              echo "$name is set (${#name} char name, value hidden)"
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo ""
            echo "Add them at:"
            echo "  Settings -> Secrets and variables -> Actions -> Repository secrets"
            echo "Names must match exactly, with underscores and no spaces."
            exit 1
          fi

      # Pulls the project's production environment config into .vercel/ so the
      # build below matches what Vercel itself would produce.
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build for production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # --prebuilt uploads the artifacts built in the step above rather than
      # rebuilding on Vercel's infrastructure, so the deployed bytes are
      # exactly the ones the tests ran against.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Summarise
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "<${{ steps.deploy.outputs.url }}>"
            echo ""
            echo "Gated on \`verify\`: lint, type-check, build and 26 end-to-end tests."
          } >> "$GITHUB_STEP_SUMMARY"
